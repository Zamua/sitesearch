name: release

# Tag a version to ship it:  git tag v0.10.0 && git push origin v0.10.0
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   DEVELOPER_ID_P12        base64 of the exported "Developer ID Application"
#                           .p12  ->  base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_P12_PASSWORD  the password used when exporting it
#   APPLE_TEAM_ID           e.g. 7FDZK7U8A6
#   APPLE_ID                the Apple ID that owns the membership
#   APPLE_APP_PASSWORD      an app-specific password from appleid.apple.com
#                           (NOT the account password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # macos-26 so the build OS matches the deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcode 26.x side by side and drop old ones,
      # so pick the newest present rather than pinning a path that disappears.
      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Build signed universal app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SiteSearch.xcodeproj \
            -target SiteSearch \
            -configuration Release \
            SYMROOT="$PWD/.build" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            build

      - name: Verify signature and architectures
        run: |
          set -euo pipefail
          APP=.build/Release/SiteSearch.app
          lipo -info "$APP/Contents/MacOS/SiteSearch"
          lipo -info "$APP/Contents/MacOS/sitesearch-mcp"
          # Every nested binary must be hardened, or notarization rejects it.
          for bin in "$APP/Contents/MacOS/"*; do
            echo "== $bin"
            codesign -dv --verbose=2 "$bin" 2>&1 | grep -E 'Authority=Developer ID|flags='
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP=.build/Release/SiteSearch.app
          # ditto, not zip: preserves the bundle's symlinks and metadata.
          ditto -c -k --keepParent "$APP" /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          # Re-zip AFTER stapling so the download carries the ticket and
          # installs cleanly with no network round-trip.
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/SiteSearch-${VERSION}.zip"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 "dist/SiteSearch-${VERSION}.zip" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### SiteSearch $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          echo "  version \"$VERSION\"" >> "$GITHUB_STEP_SUMMARY"
          echo "  sha256 \"$SHA\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "dist/SiteSearch-${VERSION}.zip" \
            --title "SiteSearch $VERSION" \
            --notes "Notarized universal build.

          Install:

              brew install --cask zamua/tap/sitesearch

          sha256: \`$SHA\`"
