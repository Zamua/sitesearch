name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macos-26 so the build OS matches the deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcode 26.x side by side and drop old ones,
      # so pick the newest present rather than pinning a path that disappears.
      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unit tests do not exercise the Spotlight/Shortcuts XPC path, so ad-hoc
      # signing is fine here. Release builds must use a real Developer ID -
      # ad-hoc signing breaks the intent at run time (see CLAUDE.md).
      - name: Test
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SiteSearch.xcodeproj \
            -scheme SiteSearch \
            -configuration Debug \
            -derivedDataPath .build/dd \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            test
