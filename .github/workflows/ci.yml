name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unit tests do not exercise the Spotlight/Shortcuts XPC path, so ad-hoc
      # signing is fine here. Release builds must use a real Developer ID -
      # ad-hoc signing breaks the intent at run time (see CLAUDE.md).
      - name: Test
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SiteSearch.xcodeproj \
            -scheme SiteSearch \
            -configuration Debug \
            -derivedDataPath .build/dd \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            test
