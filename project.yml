name: SiteSearch
options:
  bundleIdPrefix: com.zamua
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  SiteSearch:
    type: application
    platform: macOS
    sources:
      - Sources
    scheme:
      testTargets:
        - SiteSearchTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zamua.SiteSearch
        PRODUCT_NAME: SiteSearch
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FDZK7U8A6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  SiteSearchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: SiteSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zamua.SiteSearchTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FDZK7U8A6
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiteSearch.app/Contents/MacOS/SiteSearch"
        BUNDLE_LOADER: "$(TEST_HOST)"
