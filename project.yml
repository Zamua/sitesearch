name: SiteSearch
options:
  bundleIdPrefix: com.zamua
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Project-wide so the app and the embedded MCP tool report one version.
    MARKETING_VERSION: "0.11.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SiteSearch:
    type: application
    platform: macOS
    sources:
      # MCPMain is the CLI's top-level entry point; it must not be compiled
      # into the app (two @main-equivalents). The handler it drives lives in
      # Sources/MCPHandler.swift, which both targets share so the unit tests
      # can reach it.
      - path: Sources
        excludes:
          - "MCPMain/**"
      # AppIcon.icns is generated by scripts/drawicon.swift; regenerate and
      # rebuild the icns rather than editing the binary.
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: sitesearch-mcp
        copy:
          destination: executables
          # The tool target signs its own binary (hardened, Developer ID in a
          # release build) and the copy keeps that signature, which is what
          # notarization checks. NB: adding `embed: false` here silently drops
          # the whole copy phase.
    scheme:
      testTargets:
        - SiteSearchTests
    info:
      path: Sources/Info.plist
      properties:
        # This plist is GENERATED from here on every `xcodegen generate` -
        # editing Sources/Info.plist directly is silently undone. Omitting
        # these two is why every build from 0.7.0 on reported version 1.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright (c) 2026 Zamua Nasrawt. MIT licensed."
        CFBundleDocumentTypes:
          - CFBundleTypeName: SiteSearch Sites
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.zamua.sitesearch.sites
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.zamua.sitesearch.sites
            UTTypeDescription: SiteSearch Sites
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - sitesearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zamua.SiteSearch
        PRODUCT_NAME: SiteSearch
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FDZK7U8A6
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Xcode injects com.apple.security.get-task-allow (the debugger
        # entitlement) unless told not to, and notarization rejects any binary
        # carrying it. Release only - Debug needs it to attach a debugger.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # Stdio MCP server for agents: add/update/remove/search sites without the
  # GUI. Ships inside the .app at Contents/MacOS/sitesearch-mcp.
  sitesearch-mcp:
    type: tool
    platform: macOS
    sources:
      - Sources/MCPMain
      - Sources/MCPHandler.swift
      - Sources/Favicon.swift
      - Sources/Site.swift
      - Sources/SiteOps.swift
      - Sources/SiteURL.swift
    settings:
      base:
        PRODUCT_NAME: sitesearch-mcp
        SWIFT_VERSION: "6.0"
        # An Info.plist linked into the binary, so the tool knows its version
        # (MCP initialize reports it) even when run outside the app bundle.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zamua.SiteSearch.mcp
        # Nested executables need this in their own right; inheriting from the
        # app target does not happen, and notarization checks every binary.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FDZK7U8A6
      configs:
        # Same as the app target: the injected debugger entitlement is a
        # notarization hard-fail, and every nested binary is checked.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  SiteSearchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: SiteSearch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zamua.SiteSearchTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FDZK7U8A6
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SiteSearch.app/Contents/MacOS/SiteSearch"
        BUNDLE_LOADER: "$(TEST_HOST)"
